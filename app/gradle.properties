# JVM del build (CI: Temurin 21; AGP 9.2 requiere JDK 17+)
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX (el código original usa androidx en exclusiva)
android.useAndroidX=true

# Sin buildConfig por defecto en AGP 9 salvo que un módulo lo pida
android.nonTransitiveRClass=true
